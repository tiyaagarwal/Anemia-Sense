name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Anemia Detection Code"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Anemia Detection Code/requirements-dev.txt"
      - run: pip install -r requirements-dev.txt
      - name: Retrain to verify the pipeline is reproducible
        run: python train.py
      - run: python -m pytest tests/ -v
