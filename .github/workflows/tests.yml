name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Validate data quality (fails on unexpected duplicate/leakage findings)
        run: python -m src.data.validate_data

      - name: Retrain to verify the pipeline is reproducible
        run: python -m src.models.train

      - name: Regenerate explainability report
        run: python -m src.explainability.explain

      - name: Run tests
        run: python -m pytest tests/ -v
