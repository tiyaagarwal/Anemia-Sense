{% extends "base.html" %}
{% block title %}Invalid input — Anemia-Sense{% endblock %}
{% block content %}
<h1>Something's not right</h1>
<div class="card errors">
  <p>Please fix the following and try again:</p>
  <ul>
    {% for error in errors %}
    <li>{{ error }}</li>
    {% endfor %}
  </ul>
</div>
<p><a class="btn" href="{{ url_for('main.predict_form') }}">Back to the form</a></p>
{% endblock %}
